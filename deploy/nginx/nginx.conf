# HTTP перенаправляет браузер на защищённый HTTPS.
server {
    listen 8080;
    server_name pcforge.localhost;

    return 301 https://$host$request_uri;
}

# Основной сервер приложения.
server {
    listen 8443 ssl;
    http2 on;
    server_name pcforge.localhost;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/pcforge.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/pcforge.localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
