name: PCFORGE CI

on:
  push:
    branches: [main, "feature/**", "refactor/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Prepare environment file for build checks
        run: cp .env.example .env

      - name: Install dependencies
        run: npm ci

      - name: Check code style
        run: npm run lint

      - name: Build site
        run: npm run build
