name: PCFORGE CI

on:
  push:
    branches: [main, "feature/**", "refactor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, build and Docker check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          if [ ! -f package.json ]; then
            echo "::warning::package.json is not in the repository yet. The application source must be uploaded before build checks can run."
            echo "Infrastructure setup only: no app build performed."
            exit 0
          fi

      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      - name: Lint
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run lint

      - name: Build application
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build

      - name: Build Docker image
        if: ${{ hashFiles('package.json') != '' }}
        run: docker build -t pcforge:ci .
